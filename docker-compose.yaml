services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasktracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasktracker
      # Due dates are calendar days; "overdue" depends on what day it is for the
      # USER. Containers default to UTC, so set the deployment timezone in .env.
      TZ: ${TZ:-UTC}
    ports:
      - '4200:4200'
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4200
    environment:
      API_URL: http://backend:4200
      TZ: ${TZ:-UTC}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db-data:
